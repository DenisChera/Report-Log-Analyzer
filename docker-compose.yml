version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    ports:
      - '3000:80'
    depends_on:
      - backend
    restart: unless-stopped
